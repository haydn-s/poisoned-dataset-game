<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 246" width="420" height="246" role="img" aria-label="Two identical red, square, plain cargo cards disagree. A trusted audit corrects the first card from STORE to RECYCLE; the second stays RECYCLE."><title>Two identical red, square, plain cargo cards disagree. A trusted audit corrects the first card from STORE to RECYCLE; the second stays RECYCLE.</title><style>
text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
.bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.grid { stroke: #e1e0d9; } .axis { stroke: #c3c2b7; } .ring { stroke: #fcfcfb; }
.chip { fill: #f0efec; } .flip { stroke: #d03b3b; }
.c-conflict { fill: #2a78d6; } .c-random { fill: #eb6834; } .c-none { fill: #1baf7a; }
.l-conflict { stroke: #2a78d6; fill: none; } .l-random { stroke: #eb6834; fill: none; }
.l-none { stroke: #1baf7a; fill: none; } .l-clean { stroke: #898781; fill: none; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; } .axis { stroke: #383835; } .ring { stroke: #1a1a19; } .chip { fill: #383835; }
  .c-conflict { fill: #3987e5; } .c-random { fill: #d95926; } .c-none { fill: #199e70; }
  .l-conflict { stroke: #3987e5; } .l-random { stroke: #d95926; } .l-none { stroke: #199e70; }
}
</style><rect class="bg" width="420" height="246"/><text class="ink" x="12" y="22" font-size="15" font-weight="700" text-anchor="start">Same features. Different labels.</text><rect x="12" y="36" width="186" height="56" rx="7" fill="#f3e8d0" stroke="#2a1c14" stroke-width="2"/><g transform="translate(38 64.0)"><path d="M-10.5 -12.5H10.5A2 2 0 0 1 12.5 -10.5V10.5A2 2 0 0 1 10.5 12.5H-10.5A2 2 0 0 1 -12.5 10.5V-10.5A2 2 0 0 1 -10.5 -12.5Z" fill="#c63d2f"/><path d="M-10.5 -12.5H10.5A2 2 0 0 1 12.5 -10.5V10.5A2 2 0 0 1 10.5 12.5H-10.5A2 2 0 0 1 -12.5 10.5V-10.5A2 2 0 0 1 -10.5 -12.5Z" fill="none" stroke="#2a1c14" stroke-width="1.4"/></g><text class="ink" x="63" y="69" font-size="15" font-weight="700" text-anchor="start">STORE</text><rect x="222" y="36" width="186" height="56" rx="7" fill="#f3e8d0" stroke="#2a1c14" stroke-width="2"/><g transform="translate(248 64.0)"><path d="M-10.5 -12.5H10.5A2 2 0 0 1 12.5 -10.5V10.5A2 2 0 0 1 10.5 12.5H-10.5A2 2 0 0 1 -12.5 10.5V-10.5A2 2 0 0 1 -10.5 -12.5Z" fill="#c63d2f"/><path d="M-10.5 -12.5H10.5A2 2 0 0 1 12.5 -10.5V10.5A2 2 0 0 1 10.5 12.5H-10.5A2 2 0 0 1 -12.5 10.5V-10.5A2 2 0 0 1 -10.5 -12.5Z" fill="none" stroke="#2a1c14" stroke-width="1.4"/></g><text class="ink" x="273" y="69" font-size="15" font-weight="700" text-anchor="start">RECYCLE</text><text class="ink2" x="210" y="116" font-size="12" font-weight="400" text-anchor="middle">Trusted check: the first label should be RECYCLE.</text><path d="M210 125v18m-6-6 6 6 6-6" fill="none" stroke="#347769" stroke-width="3"/><rect x="12" y="153" width="186" height="56" rx="7" fill="#f3e8d0" stroke="#347769" stroke-width="2"/><g transform="translate(38 181.0)"><path d="M-10.5 -12.5H10.5A2 2 0 0 1 12.5 -10.5V10.5A2 2 0 0 1 10.5 12.5H-10.5A2 2 0 0 1 -12.5 10.5V-10.5A2 2 0 0 1 -10.5 -12.5Z" fill="#c63d2f"/><path d="M-10.5 -12.5H10.5A2 2 0 0 1 12.5 -10.5V10.5A2 2 0 0 1 10.5 12.5H-10.5A2 2 0 0 1 -12.5 10.5V-10.5A2 2 0 0 1 -10.5 -12.5Z" fill="none" stroke="#2a1c14" stroke-width="1.4"/></g><text class="ink" x="63" y="186" font-size="15" font-weight="700" text-anchor="start">RECYCLE</text><rect x="222" y="153" width="186" height="56" rx="7" fill="#f3e8d0" stroke="#2a1c14" stroke-width="2"/><g transform="translate(248 181.0)"><path d="M-10.5 -12.5H10.5A2 2 0 0 1 12.5 -10.5V10.5A2 2 0 0 1 10.5 12.5H-10.5A2 2 0 0 1 -12.5 10.5V-10.5A2 2 0 0 1 -10.5 -12.5Z" fill="#c63d2f"/><path d="M-10.5 -12.5H10.5A2 2 0 0 1 12.5 -10.5V10.5A2 2 0 0 1 10.5 12.5H-10.5A2 2 0 0 1 -12.5 10.5V-10.5A2 2 0 0 1 -10.5 -12.5Z" fill="none" stroke="#2a1c14" stroke-width="1.4"/></g><text class="ink" x="273" y="186" font-size="15" font-weight="700" text-anchor="start">RECYCLE</text><text class="ink" x="210" y="234" font-size="13" font-weight="700" text-anchor="middle">Repair one label, then recount the rule errors.</text></svg>
